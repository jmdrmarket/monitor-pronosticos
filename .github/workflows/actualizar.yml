name: Actualizar monitor

on:
  schedule:
    - cron: "0 */6 * * *"     # cada 6 horas (hora UTC)
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar mercados y publicar
        run: python tracker.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}

      - name: Guardar historial y página
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Actualización $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
